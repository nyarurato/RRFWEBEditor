<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RRF Web Editor</title>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <div class="header-left">
          <span class="app-title">RRF Web Editor</span>
          <span class="rrf-version">for RRFv3.6</span>
        </div>
        <div class="header-center">
          <div class="mode-selector">
            <label>モード:</label>
            <select id="mode-select">
              <option value="gcode-fdm">FDM / FFF</option>
              <option value="gcode-cnc">CNC / Laser</option>
            </select>
          </div>
        </div>
        <div class="header-right">
          <span id="filename-display" class="filename">untitled.gcode</span>
        </div>
      </header>

      <div id="toolbar">
        <button id="btn-new" title="新規作成 (Ctrl+N)">新規</button>
        <button id="btn-open" title="ファイルを開く (Ctrl+O)">開く</button>
        <button id="btn-save" title="ファイルに保存 (Ctrl+S)">保存</button>
        <div class="toolbar-separator"></div>
        <button id="btn-find" title="検索/置換 (Ctrl+H)">検索/置換</button>
        <div class="toolbar-separator"></div>
        <button id="btn-theme" title="テーマ切替">テーマ切替</button>
      </div>

      <div id="editor-container"></div>

      <div id="statusbar">
        <span id="status-position">行 1, 列 1</span>
        <span id="status-selection"></span>
        <span class="status-spacer"></span>
        <span id="status-encoding">UTF-8</span>
        <span id="status-eol">LF</span>
        <span id="status-lang">G-code (FDM)</span>
      </div>
    </div>

    <input type="file" id="file-input" accept=".gcode,.g,.nc,.ngc,.tap" style="display:none" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

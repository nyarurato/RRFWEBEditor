<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="YXOvsvRrMr6XDjT16WvCi4dbNEEzlSk5vUZEPs4tKYM" /><!-- For Google Search Console ownership verification -->
    <title>RRF Web Editor</title>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <div class="header-left">
          <span class="app-title">RRF Web Editor</span>
          <span class="rrf-version">for RRFv3.6</span>
        </div>
        <div class="header-center">
          <div class="mode-selector">
            <label id="mode-label">Mode:</label>
            <select id="mode-select">
              <option value="gcode-fdm">FDM / FFF</option>
              <option value="gcode-cnc" selected>CNC / Laser</option>
            </select>
          </div>
        </div>
        <div class="header-right">
          <span id="filename-display" class="filename">untitled.gcode</span>
        </div>
      </header>

      <div id="toolbar">
        <button id="btn-new" title="New File (Ctrl+N)">New</button>
        <button id="btn-open" title="Open File (Ctrl+O)">Open</button>
        <button id="btn-save" title="Save File (Ctrl+S)">Save</button>
        <div class="toolbar-separator"></div>
        <button id="btn-find" title="Find/Replace (Ctrl+H)">Find/Replace</button>
        <div class="toolbar-separator"></div>
        <button id="btn-command-palette" title="Command Palette (F1)">Command Palette</button>
        <div class="toolbar-separator"></div>
        <button id="btn-theme" title="Toggle Theme">Theme</button>
        <div class="toolbar-separator"></div>
        <button id="btn-settings" title="Settings">⚙ Settings</button>
      </div>

      <!-- Settings panel (hidden by default) -->
      <div id="settings-panel" class="settings-panel hidden" role="dialog" aria-label="Editor Settings">
        <div class="settings-section">
          <div class="settings-label" id="settings-wrap-label">Word Wrap</div>
          <div class="settings-row">
            <label class="settings-check">
              <input type="checkbox" id="wrap-enabled" />
              <span id="wrap-enabled-label">Enabled</span>
            </label>
            <input type="number" id="wrap-column" value="80" min="20" max="500" step="1" />
            <span class="settings-unit" id="wrap-column-unit">col</span>
          </div>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-section">
          <div class="settings-label" id="settings-indent-label">Indent</div>
          <div class="settings-row">
            <input type="number" id="indent-size" value="2" min="1" max="8" step="1" />
            <span class="settings-unit" id="indent-unit">spaces</span>
          </div>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-section">
          <div class="settings-label" id="settings-eol-label">Line Ending</div>
          <div class="settings-row">
            <select id="eol-select">
              <option value="lf">LF (Unix / macOS)</option>
              <option value="crlf">CRLF (Windows)</option>
            </select>
          </div>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-section">
          <div class="settings-label" id="settings-lang-label">Language</div>
          <div class="settings-row">
            <select id="lang-select">
              <option value="en">English</option>
              <option value="ja">日本語</option>
            </select>
          </div>
        </div>
      </div>

      <div id="editor-container"></div>

      <div id="statusbar">
        <span id="status-position">Ln 1, Col 1</span>
        <span id="status-selection"></span>
        <span class="status-spacer"></span>
        <span id="status-encoding">UTF-8</span>
        <span id="status-eol">LF</span>
        <span id="status-lang">G-code (FDM)</span>
      </div>
    </div>

    <input type="file" id="file-input" accept=".gcode,.g,.nc,.ngc,.tap" style="display:none" />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
